<!DOCTYPE html>
<html ng-app="escolaApp"> <head>
    <meta charset="UTF-8">
    <title>Desafio 4 - Início AngularJS</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
</head>
<body ng-controller="AppController"> <h1 ng-bind="mensagem"></h1>

    <div class="perfil">
        <h3>Nome: {{ usuario.nome }}</h3>
        <p>Tipo: {{ usuario.tipo }}</p>

        <div ng-if="usuario.tipo === 'Aluno'">
            <p>Status: Estudante matriculado</p>
            <img src="https://via.placeholder.com/150/0000FF/FFFFFF?text=ALUNO" alt="Ícone Aluno">
        </div>

        <div ng-if="usuario.tipo === 'Professor'">
            <p>Status: Docente ativo</p>
            <img src="https://via.placeholder.com/150/008000/FFFFFF?text=PROFESSOR" alt="Ícone Professor">
        </div>
    </div>

</body>
</html>
