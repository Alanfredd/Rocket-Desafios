<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Desafio 9 - Validação RegEx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Cadastro Seguro</h2>
        <p>Validação via Expressões Regulares</p>
        
        <form id="validadorForm">
            <div class="input-group">
                <input type="text" id="nome" placeholder="Nome completo (apenas letras)">
                <span id="msg-nome" class="status-msg"></span>
            </div>

            <div class="input-group">
                <input type="text" id="email" placeholder="E-mail (exemplo@dominio.com)">
                <span id="msg-email" class="status-msg"></span>
            </div>

            <div class="input-group">
                <input type="text" id="cpf" placeholder="CPF (000.000.000-00)">
                <span id="msg-cpf" class="status-msg"></span>
            </div>

            <button type="submit" id="btnEnviar">Validar Dados</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
