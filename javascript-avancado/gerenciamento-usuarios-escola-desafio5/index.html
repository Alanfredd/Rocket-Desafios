<!DOCTYPE html>
<html ng-app="escolaApp">
<head>
    <meta charset="UTF-8">
    <title>Desafio 5 - Gerenciamento Escolar</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 8px; }
        .Aluno { border-left: 5px solid blue; }
        .Professor { border-left: 5px solid green; }
        .stats { background: #f0f0f0; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        input, select { padding: 8px; margin-right: 10px; margin-bottom: 10px; }
    </style>
</head>
<body ng-controller="AppController">

    <h1 ng-bind="mensagem"></h1>

    <div class="stats">
        <strong>Total de Alunos:</strong> {{ (usuarios | filter:{tipo: 'Aluno'}).length }} | 
        <strong>Total de Professores:</strong> {{ (usuarios | filter:{tipo: 'Professor'}).length }}
    </div>

    <div>
        <input type="text" ng-model="filtro" placeholder="Busca geral...">
        <select ng-model="filtroTipo">
            <option value="">Filtrar por Tipo (Todos)</option>
            <option value="Aluno">Alunos</option>
            <option value="Professor">Professores</option>
        </select>
    </div>

    <hr>

    <div ng-controller="ListaController">
        <h3>Lista de Usuários</h3>
        
        <div class="card {{ u.tipo }}" ng-repeat="u in usuarios | filter:filtro | filter:{tipo: filtroTipo}">
            <strong>{{ u.nome | uppercase }}</strong> - {{ u.tipo }} <br>
            <small>Cadastrado em: {{ u.dataCadastro | date:'dd/MM/yyyy' }}</small>
        </div>
    </div>

</body>
</html>
