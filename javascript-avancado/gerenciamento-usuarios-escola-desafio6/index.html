<!DOCTYPE html>
<html ng-app="escolaApp">
<head>
    <meta charset="UTF-8">
    <title>Desafio 6 - Services</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #121212; color: white; }
        .form-cadastro { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .card { border: 1px solid #333; padding: 10px; margin: 10px 0; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .btn-add { background: #28a745; color: white; border: none; padding: 8px; cursor: pointer; }
        .btn-remove { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        input, select { padding: 5px; margin-right: 10px; }
    </style>
</head>
<body ng-controller="AppController">

    <h1 ng-bind="mensagem"></h1>

    <div class="form-cadastro">
        <h3>Novo Usuário</h3>
        <input type="text" ng-model="novoUsuario.nome" placeholder="Nome do usuário">
        <select ng-model="novoUsuario.tipo">
            <option value="">Selecione o Tipo</option>
            <option value="Aluno">Aluno</option>
            <option value="Professor">Professor</option>
        </select>
        <button class="btn-add" ng-click="adicionarNovo()">Adicionar na Lista</button>
    </div>

    <hr>

    <div ng-repeat="u in usuarios track by $index" class="card">
        <div>
            <strong>{{ u.nome | uppercase }}</strong> ({{ u.tipo }}) <br>
            <small>Cadastrado em: {{ u.dataCadastro | date:'dd/MM/yyyy HH:mm' }}</small>
        </div>
        <button class="btn-remove" ng-click="removerUsuario($index)">Remover</button>
    </div>

</body>
</html>
