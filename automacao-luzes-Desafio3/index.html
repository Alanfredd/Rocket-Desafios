<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Automação de Luzes - Singleton</title>
    <style>
        .comodo {
            width: 100px;
            height: 100px;
            margin: 10px;
            display: inline-block;
            border: 2px solid black;
            background-color: gray; 
        }
    </style>
</head>
<body>
    <h1>Central de Automação Singleton</h1>

    <div id="quarto" class="comodo">Quarto</div>
    <div id="sala" class="comodo">Sala</div>

    <hr>

    <button class="btn-luz" data-comodo="quarto" data-acao="ligar">Ligar Quarto</button>
    <button class="btn-luz" data-comodo="quarto" data-acao="desligar">Desligar Quarto</button>
    
    <br><br>

    <button class="btn-luz" data-comodo="sala" data-acao="ligar">Ligar Sala</button>
    <button class="btn-luz" data-comodo="sala" data-acao="desligar">Desligar Sala</button>

    <p id="status">Aguardando comando...</p>

    <script src="automacao.js"></script>
</body>
</html>
