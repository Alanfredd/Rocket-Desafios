<!DOCTYPE html>
<html ng-app="escolaApp">
<head>
    <meta charset="UTF-8">
    <title>Desafio 7 - Validação e Promises</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #121212; color: white; }
        .form-container { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .error { color: #ff6b6b; font-size: 0.8em; display: block; margin-top: 5px; }
        .success-msg { color: #51cf66; font-weight: bold; margin-bottom: 10px; }
        .loading { color: #ffd43b; font-style: italic; }
        input, select { display: block; width: 100%; max-width: 300px; padding: 8px; margin-top: 5px; }
        .btn-enviar { margin-top: 15px; padding: 10px 20px; cursor: pointer; }
        .btn-enviar:disabled { cursor: not-allowed; opacity: 0.5; }
        .card { border: 1px solid #333; padding: 10px; margin-top: 10px; display: flex; justify-content: space-between; }
    </style>
</head>
<body ng-controller="AppController">

    <h1>Cadastro de Usuários</h1>

    <div class="form-container">
        <form name="userForm" ng-submit="enviarFormulario()" novalidate>
            
            <div ng-show="mensagemSucesso" class="success-msg">{{ mensagemSucesso }}</div>
            <div ng-show="carregando" class="loading">Enviando para o servidor... aguarde.</div>

            <label>Nome:</label>
            <input type="text" name="nome" ng-model="novoUsuario.nome" required placeholder="Digite o nome">
            <span class="error" ng-show="userForm.nome.$dirty && userForm.nome.$error.required">O nome é obrigatório.</span>

            <label>E-mail:</label>
            <input type="email" name="email" ng-model="novoUsuario.email" required placeholder="exemplo@email.com">
            <span class="error" ng-show="userForm.email.$dirty && userForm.email.$invalid">Insira um e-mail válido.</span>

            <label>Tipo:</label>
            <select name="tipo" ng-model="novoUsuario.tipo" required>
                <option value="">Selecione...</option>
                <option value="Aluno">Aluno</option>
                <option value="Professor">Professor</option>
            </select>
            <span class="error" ng-show="userForm.tipo.$dirty && userForm.tipo.$error.required">Selecione uma opção.</span>

            <button type="submit" class="btn-enviar" ng-disabled="userForm.$invalid || carregando">
                {{ carregando ? 'Salvando...' : 'Cadastrar Usuário' }}
            </button>
        </form>
    </div>

    <hr>

    <div ng-repeat="u in usuarios track by $index" class="card">
        <div>
            <strong>{{ u.nome | uppercase }}</strong> ({{ u.tipo }})<br>
            <small>{{ u.email }} | Cadastrado em: {{ u.dataCadastro | date:'dd/MM/yyyy HH:mm' }}</small>
        </div>
        <button ng-click="removerUsuario($index)" style="background:red; color:white; border:none; padding:5px;">Remover</button>
    </div>

</body>
</html>
